# SonarCloud project settings. See docs.sonarsource.com/sonarqube-cloud.
#
# Confirm sonar.organization/sonar.projectKey against the real SonarCloud
# project before the first scan — Cargo.toml's `repository` field names
# amsys/s3armor, but no git remote is configured in this checkout yet.
sonar.organization=amsys
sonar.projectKey=amsys_s3armor

sonar.sources=crates
sonar.tests=crates/s3armor/tests,crates/s3armor-format/tests
sonar.exclusions=**/testdata/**,crates/s3armor-format/fuzz/**,target/**,crates/s3armor/tests/**,crates/s3armor-format/tests/**
# Keep the same files out of coverage as COVERAGE_IGNORE in .github/workflows/ci.yml.
# lcov.info has no data for them, so Sonar would count them as uncovered.
sonar.coverage.exclusions=crates/s3armor/src/main.rs,crates/s3armor/src/tools/check.rs,crates/s3armor/src/tools/bench.rs

# rust:S4790 (weak hash) flags MD5 in body.rs. There, MD5 is the S3
# Content-MD5/ETag protocol contract, not a security control. The rule stays
# active for all other files.
sonar.issue.ignore.multicriteria=md5proto
sonar.issue.ignore.multicriteria.md5proto.ruleKey=rust:S4790
sonar.issue.ignore.multicriteria.md5proto.resourceKey=crates/s3armor/src/proxy/body.rs

# Sonar's Rust analyzer runs clippy itself and picks up [workspace.lints]
# from the root Cargo.toml automatically — no separate report import needed.
sonar.rust.cargo.manifestPaths=Cargo.toml
sonar.rust.lcov.reportPaths=lcov.info
