# SonarCloud project settings. See docs.sonarsource.com/sonarqube-cloud.
#
# Confirm sonar.organization/sonar.projectKey against the real SonarCloud
# project before the first scan — Cargo.toml's `repository` field names
# amsys/s3armor, but no git remote is configured in this checkout yet.
sonar.organization=amsys
sonar.projectKey=amsys_s3armor

sonar.sources=crates
sonar.tests=crates/s3armor/tests,crates/s3armor-format/tests
sonar.exclusions=**/testdata/**,crates/s3armor-format/fuzz/**,target/**

# Sonar's Rust analyzer runs clippy itself and picks up [workspace.lints]
# from the root Cargo.toml automatically — no separate report import needed.
sonar.rust.cargo.manifestPaths=Cargo.toml
sonar.rust.lcov.reportPaths=lcov.info
