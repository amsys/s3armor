[package]
name = "s3armor-format"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# Pure crypto/framing crate: no tokio, no http. See AGENTS.md.
[dependencies]
aead = "0.5"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rsa = "0.9"
sha2 = "0.10"
hkdf = "0.12"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"
hex = "0.4"

[dev-dependencies]
proptest = "1"
criterion = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "crypto"
harness = false
